{% extends "layout.html" %}
{% block content %}
<div class="container py-5" style="max-width:600px;">
  <h1 class="mb-4">Add Property</h1>
  <form action="/properties/" method="POST">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Image URL</label>
      <input type="text" name="image_url" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Region</label>
      <input type="text" name="region" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Bedroom number</label>
      <input type="number" name="bedroom_no" class="form-control" min="1">
    </div>
    <div class="mb-3">
      <label class="form-label">Price ($)</label>
      <input type="number" name="price" class="form-control" min="0">
    </div>
    <button class="btn btn-primary">Add property</button>
    <a href="/" class="btn btn-outline-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
